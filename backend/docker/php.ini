; Overrides on top of php.ini-production.

; Include "E" so PHP running inside Apache fills $_ENV from the container's environment
; variables. Without it, Symfony never sees the Render env vars (APP_ENV, DATABASE_URL, ...)
; and silently falls back to the committed .env defaults (APP_ENV=dev, local database).
variables_order = "EGPCS"

; Don't send "X-Powered-By: PHP/8.x.y": it tells attackers the exact PHP version for free.
expose_php = Off
