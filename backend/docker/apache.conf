# Avoids Apache's "Could not reliably determine the server's fully qualified domain name" warning.
ServerName localhost

# Don't reveal versions: "Server: Apache" instead of "Apache/2.4.x (Debian)",
# and no version footer on Apache's own error pages.
# (Server-wide settings: they stay outside <VirtualHost>. This file loads after Debian's
# conf-enabled/security.conf, so these values override its defaults.)
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    # Only public/ is web-visible; src/, config/, .env etc. can never be served.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Any URL that is not an existing file goes to Symfony's front controller.
        FallbackResource /index.php
    </Directory>

    # Pass the Authorization header (Bearer token) through to PHP.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    # Logs go to the container's stdout/stderr, so they show up in Render's log view.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
