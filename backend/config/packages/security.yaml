security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Where Symfony loads users from: the users table, looked up by email.
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            pattern: ^/api
            # No session cookie: the Bearer token sent with each request is the login (PLAN.md §6).
            # A stateless firewall checks any token it receives, even on public routes (Symfony ignores
            # "lazy" here), and a bad token gets 401 as the Bearer standard (RFC 6750) says. So the
            # frontend sends the token only to the endpoints that need it (apiFetch's `auth` option).
            stateless: true
            provider: app_users
            # A guest on a protected route gets a JSON 401 instead of an empty one.
            entry_point: App\Security\ApiAuthErrorResponder
            # Symfony's built-in "Authorization: Bearer <token>" authenticator. Our handler maps a token to a user.
            access_token:
                token_handler: App\Security\ApiTokenHandler
                failure_handler: App\Security\ApiAuthErrorResponder

    # Only the *first* matching rule is applied. Everything not listed here is public.
    # (/|$) makes "me" match /api/me but not some future /api/merch.
    access_control:
        - { path: '^/api/(checkout|orders|me|auth/logout)(/|$)', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
